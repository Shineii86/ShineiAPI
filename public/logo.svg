<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#f5f0e8"/>
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#1a1a1a" stroke-width="8"/>

  <!-- Decorative corner squares -->
  <rect x="20" y="20" width="24" height="24" fill="#ffcc00" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="468" y="20" width="24" height="24" fill="#e63b2e" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="20" y="468" width="24" height="24" fill="#0055ff" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="468" y="468" width="24" height="24" fill="#ffcc00" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Main star -->
  <g transform="translate(256, 210)">
    <polygon points="0,-90 20,-28 86,-28 32,10 52,74 0,36 -52,74 -32,10 -86,-28 -20,-28" fill="#ffcc00" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
    <!-- Shadow -->
    <polygon points="6,-84 24,-26 84,-26 36,12 54,72 6,38 -46,78 -28,14 -80,-24 -16,-24" fill="#1a1a1a" opacity="0.08"/>
  </g>

  <!-- SHINEI text -->
  <text x="256" y="120" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="32" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="14">SHINEI</text>

  <!-- API text -->
  <text x="256" y="370" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="80" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="-3">API</text>

  <!-- Version badge -->
  <rect x="206" y="400" width="100" height="30" fill="#ffcc00" stroke="#1a1a1a" stroke-width="3"/>
  <text x="256" y="421" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">v2.0.1</text>

  <!-- Bottom accent bar -->
  <rect x="156" y="445" width="200" height="4" fill="#1a1a1a"/>
</svg>
