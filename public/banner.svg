<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffcc00"/>
      <stop offset="50%" style="stop-color:#ff9500"/>
      <stop offset="100%" style="stop-color:#ffcc00"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="1920" height="640" fill="none"/>

  <!-- Ambient glow blobs -->
  <circle cx="300" cy="200" r="250" fill="#ffcc00" opacity="0.06" filter="url(#blur1)"/>
  <circle cx="1600" cy="450" r="300" fill="#ff9500" opacity="0.05" filter="url(#blur1)"/>
  <circle cx="960" cy="100" r="200" fill="#ffcc00" opacity="0.04" filter="url(#blur2)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="640"/><line x1="120" y1="0" x2="120" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/><line x1="360" y1="0" x2="360" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/><line x1="840" y1="0" x2="840" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/><line x1="1080" y1="0" x2="1080" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/><line x1="1320" y1="0" x2="1320" y2="640"/>
    <line x1="1440" y1="0" x2="1440" y2="640"/><line x1="1560" y1="0" x2="1560" y2="640"/>
    <line x1="1680" y1="0" x2="1680" y2="640"/><line x1="1800" y1="0" x2="1800" y2="640"/>
    <line x1="0" y1="0" x2="1920" y2="0"/><line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/><line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/><line x1="0" y1="600" x2="1920" y2="600"/>
  </g>

  <!-- Decorative corner accents -->
  <g opacity="0.15">
    <rect x="40" y="40" width="80" height="3" fill="url(#accent)" rx="1.5"/>
    <rect x="40" y="40" width="3" height="80" fill="url(#accent)" rx="1.5"/>
    <rect x="1800" y="40" width="80" height="3" fill="url(#accent)" rx="1.5"/>
    <rect x="1877" y="40" width="3" height="80" fill="url(#accent)" rx="1.5"/>
    <rect x="40" y="597" width="80" height="3" fill="url(#accent)" rx="1.5"/>
    <rect x="40" y="520" width="3" height="80" fill="url(#accent)" rx="1.5"/>
    <rect x="1800" y="597" width="80" height="3" fill="url(#accent)" rx="1.5"/>
    <rect x="1877" y="520" width="3" height="80" fill="url(#accent)" rx="1.5"/>
  </g>

  <!-- Decorative floating elements -->
  <g opacity="0.08">
    <text x="150" y="500" font-family="monospace" font-size="120" fill="#ffcc00">{</text>
    <text x="1700" y="200" font-family="monospace" font-size="120" fill="#ffcc00">}</text>
    <text x="1650" y="550" font-family="monospace" font-size="80" fill="#fff">/</text>
    <circle cx="200" cy="150" r="4" fill="#ffcc00"/>
    <circle cx="1750" cy="480" r="3" fill="#ffcc00"/>
    <circle cx="1800" cy="120" r="5" fill="#ff9500"/>
  </g>

  <!-- Main content group -->
  <g filter="url(#shadow)">
    <!-- Logo mark - 水 in hexagon -->
    <g transform="translate(960, 180)">
      <polygon points="0,-55 48,-27.5 48,27.5 0,55 -48,27.5 -48,-27.5" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>
      <text x="0" y="18" font-family="'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#ffcc00" text-anchor="middle">水</text>
    </g>

    <!-- Title -->
    <text x="960" y="290" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">
      ShineiAPI
    </text>

    <!-- Accent line -->
    <rect x="860" y="310" width="200" height="3" rx="1.5" fill="url(#accent)"/>

    <!-- Subtitle -->
    <text x="960" y="365" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#999" text-anchor="middle" letter-spacing="6">
      FREE MANGA REST API
    </text>

    <!-- Description -->
    <text x="960" y="420" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#666" text-anchor="middle">
      Manga, Manhwa &amp; Webtoon data — No authentication required
    </text>

    <!-- Badges -->
    <g transform="translate(960, 475)" text-anchor="middle">
      <g transform="translate(-280, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="13" font-weight="600" fill="#4ade80">🔓 No Auth</text>
      </g>
      <g transform="translate(-100, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="13" font-weight="600" fill="#60a5fa">⚡ 60 req/min</text>
      </g>
      <g transform="translate(90, 0)">
        <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">✨ Free</text>
      </g>
      <g transform="translate(240, 0)">
        <rect x="-55" y="-15" width="110" height="30" rx="15" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🌐 CORS</text>
      </g>
    </g>

    <!-- URL -->
    <text x="960" y="545" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#555" text-anchor="middle">
      shineiapi.vercel.app
    </text>
  </g>

  <!-- Top-right version badge -->
  <g transform="translate(1830, 30)">
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#222" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" font-family="-apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#888" text-anchor="middle">v2.0.1</text>
  </g>
</svg>
